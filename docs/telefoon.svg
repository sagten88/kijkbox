<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 740" role="img" aria-label="Kijkbox op een telefoon: overzicht van films" font-family="Manrope, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .t{fill:#f1f2f4}.m{fill:#9aa1ad}.c{fill:#181b21}
    .card{animation:rise .8s ease-out both}
    .d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}.d4{animation-delay:.4s}.d5{animation-delay:.5s}.d6{animation-delay:.6s}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
