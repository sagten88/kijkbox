  <g class="card d2"><rect x="142" y="174" width="96" height="140" rx="10" fill="url(#p2)"/><text x="142" y="334" font-size="13" font-weight="700" class="t">Blauw uur</text><text x="142" y="352" font-size="12" class="m">2024</text></g>
