<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-label="Kijkbox: je eigen tv-omgeving voor het hele huis" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .glow{animation:glow 6s ease-in-out infinite}
    @keyframes glow{0%,100%{opacity:.45}50%{opacity:.9}}
    .icon{animation:pop 4s ease-in-out infinite;transform-origin:152px 180px}
    @keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
    .chip rect{fill:#181b21;stroke:#2c313b}
    .chip text{fill:#c9ced6}
    .c1 rect,.c2 rect,.c3 rect,.c4 rect,.c5 rect{animation:chip 10s infinite}
    .c1 text,.c2 text,.c3 text,.c4 text,.c5 text{animation:chipt 10s infinite}
    .c2 rect,.c2 text{animation-delay:2s}.c3 rect,.c3 text{animation-delay:4s}
    .c4 rect,.c4 text{animation-delay:6s}.c5 rect,.c5 text{animation-delay:8s}
    @keyframes chip{0%,22%,100%{fill:#181b21;stroke:#2c313b}4%,16%{fill:#3a3220;stroke:#f2b632}}
    @keyframes chipt{0%,22%,100%{fill:#c9ced6}4%,16%{fill:#f2b632}}
    .bar{animation:bar 12s linear infinite;transform-origin:968px 0}
    @keyframes bar{from{transform:scaleX(.08)}to{transform:scaleX(1)}}
    .live{animation:live 1.6s ease-in-out infinite}
    @keyframes live{50%{opacity:.35}}
    .scan{animation:scan 5s ease-in-out infinite alternate}
    @keyframes scan{from{transform:translateX(0)}to{transform:translateX(120px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <radialGradient id="halo" cx="0.12" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#f2b632" stop-opacity=".28"/>
      <stop offset="1" stop-color="#f2b632" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/><stop offset=".6" stop-color="#2b2350"/><stop offset="1" stop-color="#101216"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" rx="24" fill="#101216"/>
  <rect class="glow" width="1280" height="360" rx="24" fill="url(#halo)"/>

  <!-- logo -->
  <g class="icon">
    <rect x="72" y="100" width="160" height="160" rx="36" fill="#f2b632"/>
    <rect x="102" y="142" width="100" height="76" rx="12" fill="#101216"/>
    <path d="M139 162v36l29-18z" fill="#f2b632"/>
  </g>

  <text x="272" y="182" font-size="88" font-weight="800" fill="#f1f2f4">Kijkbox</text>
  <text x="276" y="228" font-size="28" fill="#9aa1ad">Je eigen tv-omgeving voor het hele huis</text>

  <g font-size="18" font-weight="600">
    <g class="chip c1"><rect x="276" y="254" width="96" height="38" rx="19"/><text x="324" y="279" text-anchor="middle">Live tv</text></g>
    <g class="chip c2"><rect x="382" y="254" width="104" height="38" rx="19"/><text x="434" y="279" text-anchor="middle">Tv-gids</text></g>
    <g class="chip c3"><rect x="496" y="254" width="84" height="38" rx="19"/><text x="538" y="279" text-anchor="middle">Films</text></g>
    <g class="chip c4"><rect x="590" y="254" width="92" height="38" rx="19"/><text x="636" y="279" text-anchor="middle">Series</text></g>
    <g class="chip c5"><rect x="692" y="254" width="100" height="38" rx="19"/><text x="742" y="279" text-anchor="middle">Tv-app</text></g>
  </g>

  <!-- tv -->
  <rect x="930" y="58" width="290" height="190" rx="14" fill="#05070a" stroke="#2c313b" stroke-width="2"/>
  <rect x="944" y="72" width="262" height="162" rx="8" fill="url(#screen)"/>
  <rect class="live" x="958" y="86" width="46" height="20" rx="4" fill="#e5484d"/>
  <text x="981" y="101" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">LIVE</text>
  <circle cx="1075" cy="150" r="26" fill="#f2b632" fill-opacity=".95"/>
  <path d="M1066 137v26l22-13z" fill="#101216"/>
  <rect x="968" y="206" width="214" height="6" rx="3" fill="#ffffff" fill-opacity=".18"/>
  <rect class="bar" x="968" y="206" width="214" height="6" rx="3" fill="#f2b632"/>
  <rect x="1050" y="248" width="50" height="22" fill="#2c313b"/>
  <rect x="1010" y="268" width="130" height="8" rx="4" fill="#2c313b"/>
  <!-- gids -->
  <g fill="#181b21">
    <rect x="930" y="290" width="290" height="14" rx="4"/>
    <rect x="930" y="310" width="290" height="14" rx="4"/>
  </g>
  <rect class="scan" x="934" y="292" width="150" height="10" rx="3" fill="#3a3220" stroke="#f2b632" stroke-width="1"/>
  <rect x="1000" y="312" width="120" height="10" rx="3" fill="#2c313b"/>
</svg>
