<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-label="Installatiescript van Kijkbox in een terminal" font-family="'Fira Code', Consolas, 'Courier New', monospace" font-size="16">
  <style>
    .l{opacity:0}
    .a1{animation:a1 14s infinite}.a2{animation:a2 14s infinite}.a3{animation:a3 14s infinite}.a4{animation:a4 14s infinite}
    .a5{animation:a5 14s infinite}.a6{animation:a6 14s infinite}.a7{animation:a7 14s infinite}.a8{animation:a8 14s infinite}
    @keyframes a1{0%,6%{opacity:0}8%,94%{opacity:1}100%{opacity:0}}
    @keyframes a2{0%,16%{opacity:0}18%,94%{opacity:1}100%{opacity:0}}
    @keyframes a3{0%,26%{opacity:0}28%,94%{opacity:1}100%{opacity:0}}
