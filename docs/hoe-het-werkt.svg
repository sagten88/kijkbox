<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" role="img" aria-label="Zo werkt Kijkbox: jouw bron gaat via je eigen Kijkbox-server naar telefoon, tablet, laptop en tv" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .box{fill:#181b21;stroke:#2c313b;stroke-width:2}
    .t{fill:#f1f2f4}.m{fill:#9aa1ad}.y{fill:#f2b632}
    .line{fill:none;stroke:#2c313b;stroke-width:3}
    .flow{fill:none;stroke:#f2b632;stroke-width:3;stroke-dasharray:6 18;animation:flow 1.2s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-24}}
    .srv{animation:srv 3s ease-in-out infinite}
    @keyframes srv{0%,100%{stroke:#2c313b}50%{stroke:#f2b632}}
    .dev{animation:dev 8s infinite}
    .d2{animation-delay:2s}.d3{animation-delay:4s}.d4{animation-delay:6s}
    @keyframes dev{0%,30%,100%{stroke:#2c313b}8%,22%{stroke:#14B8A6}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <rect width="1280" height="440" rx="24" fill="#101216"/>

  <!-- lijnen -->
  <path id="p0" class="line" d="M320 220 H500"/>
  <path class="flow" d="M320 220 H500"/>
  <g>
    <path id="p1" class="line" d="M800 220 C890 220 890 92 980 92"/>
    <path id="p2" class="line" d="M800 220 C890 220 890 176 980 176"/>
    <path id="p3" class="line" d="M800 220 C890 220 890 264 980 264"/>
    <path id="p4" class="line" d="M800 220 C890 220 890 348 980 348"/>
    <path class="flow" d="M800 220 C890 220 890 92 980 92"/>
    <path class="flow" d="M800 220 C890 220 890 176 980 176"/>
    <path class="flow" d="M800 220 C890 220 890 264 980 264"/>
    <path class="flow" d="M800 220 C890 220 890 348 980 348"/>
  </g>
  <g fill="#f2b632">
    <circle r="6"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#p0"/></animateMotion></circle>
    <circle r="6"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#p0"/></animateMotion></circle>
  </g>
  <g fill="#14B8A6">
    <circle r="6"><animateMotion dur="2s" begin="0s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="6"><animateMotion dur="2s" begin=".5s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
    <circle r="6"><animateMotion dur="2s" begin="1s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
    <circle r="6"><animateMotion dur="2s" begin="1.5s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
  </g>

  <!-- bron -->
  <rect class="box" x="60" y="150" width="260" height="140" rx="16"/>
  <text x="84" y="196" font-size="24" font-weight="700" class="t">Jouw bron</text>
  <text x="84" y="228" font-size="17" class="m">IPTV-abonnement,</text>
  <text x="84" y="252" font-size="17" class="m">M3U of losse stream</text>
  <text x="84" y="276" font-size="14" class="m" font-style="italic">je eigen, Kijkbox levert niets</text>

  <!-- server -->
  <rect class="box srv" x="500" y="100" width="300" height="240" rx="18"/>
  <rect x="528" y="128" width="56" height="56" rx="13" fill="#f2b632"/>
  <rect x="538" y="142" width="36" height="28" rx="5" fill="#101216"/>
  <path d="M551 149v14l11-7z" fill="#f2b632"/>
  <text x="600" y="166" font-size="30" font-weight="800" class="t">Kijkbox</text>
  <text x="528" y="218" font-size="17" class="m">op je eigen server</text>
  <text x="528" y="248" font-size="16" class="y">● accounts en profielen</text>
  <text x="528" y="274" font-size="16" class="y">● tv-gids en ondertitels</text>
  <text x="528" y="300" font-size="16" class="y">● alleen je thuisnetwerk</text>

  <!-- apparaten -->
  <g font-size="20" font-weight="600">
    <rect class="box dev" x="980" y="62" width="240" height="60" rx="14"/>
    <rect x="1000" y="74" width="20" height="36" rx="4" fill="none" stroke="#9aa1ad" stroke-width="2"/>
    <text x="1040" y="99" class="t">Telefoon</text>

    <rect class="box dev d2" x="980" y="146" width="240" height="60" rx="14"/>
    <rect x="996" y="160" width="30" height="32" rx="4" fill="none" stroke="#9aa1ad" stroke-width="2"/>
    <text x="1040" y="183" class="t">Tablet</text>

    <rect class="box dev d3" x="980" y="234" width="240" height="60" rx="14"/>
    <rect x="997" y="250" width="28" height="20" rx="3" fill="none" stroke="#9aa1ad" stroke-width="2"/>
    <rect x="992" y="272" width="38" height="4" rx="2" fill="#9aa1ad"/>
    <text x="1040" y="271" class="t">Laptop</text>

    <rect class="box dev d4" x="980" y="318" width="240" height="60" rx="14"/>
    <rect x="994" y="332" width="34" height="24" rx="3" fill="none" stroke="#9aa1ad" stroke-width="2"/>
    <rect x="1006" y="358" width="10" height="6" fill="#9aa1ad"/>
    <text x="1040" y="355" class="t">Tv-app</text>
  </g>

  <text x="640" y="400" font-size="17" class="m" text-anchor="middle">Je server haalt de streams op en maakt ze geschikt voor elk scherm in huis.</text>
</svg>
