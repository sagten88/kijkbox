# Docker-image bouwen en testen; bij een versie-tag (v1.7.0) ook publiceren op ghcr.io.
name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Image bouwen
        run: docker build -t ghcr.io/sagten88/kijkbox:latest .

      - name: Compose-bestanden controleren
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.https.yml config -q
          # Met https mag Kijkbox zelf geen poort openzetten: alleen via Caddy.
          test "$(docker compose -f docker-compose.yml -f docker-compose.https.yml config --format json | jq '.services.kijkbox.ports // [] | length')" = 0

      - name: Starten met docker compose
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q kijkbox)")" = healthy ] && break
            sleep 2
          done
          docker compose ps
          test "$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q kijkbox)")" = healthy

      - name: Website, ffmpeg en eerste account
        run: |
          curl -fsS http://127.0.0.1:3000/ | grep -q '<meta name="kijkbox-version"'
          curl -fsS http://127.0.0.1:3000/api/state | jq -e '.needsSetup == true'
          curl -fsS -o /dev/null http://127.0.0.1:3000/tv.apk
          docker compose exec -T kijkbox ffmpeg -hide_banner -version | head -1
          CODE="$(docker compose logs kijkbox | grep -o 'account: *[A-F0-9]*' | grep -o '[A-F0-9]*$' | tail -1)"
          test -n "$CODE"
          curl -fsS -c cookies -H 'content-type: application/json' \
            -d "{\"code\":\"$CODE\",\"username\":\"beheer\",\"password\":\"test-wachtwoord\"}" http://127.0.0.1:3000/api/setup
          curl -fsS -b cookies http://127.0.0.1:3000/api/state | jq -e '.user.role == "admin"'

      - name: Gegevens blijven bewaard na herstart
        run: |
          docker compose down
          docker compose up -d
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/state >/dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:3000/api/state | jq -e '.needsSetup == false'
          curl -fsS -b cookies http://127.0.0.1:3000/api/state | jq -e '.user.username == "beheer"'

      - name: Logboek bij een fout
        if: failure()
        run: docker compose logs

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sagten88/kijkbox
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
